<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Geist Font</title>
<style>html{background:#000;color:#888;font:14px ui-monospace,monospace}body{margin:40px}</style>
<body>Loading…
<script>
(async () => {
  const BASE = "/geist-proofer/";
  const fail = m => { document.body.textContent = m; };
  if (!('serviceWorker' in navigator)) return fail('This page needs a browser with service workers (not a private window in Firefox).');
  // stop only if this page keeps coming back: more than three starts within ten seconds
  const now = Date.now(), starts = (sessionStorage.pgBoot || '').split(',').map(Number).filter(t => now - t < 10000);
  if (starts.length > 3) { sessionStorage.pgBoot = ''; return fail('Could not start. Reload to try again.'); }
  sessionStorage.pgBoot = starts.concat(now).join();
  const go = () => {
    const rest = location.pathname.slice(BASE.length);
    if (rest === '' || rest === 'index.html' || rest === '404.html') location.replace(BASE + 'font' + location.search);
    else location.reload();
  };
  try {
    await navigator.serviceWorker.register(BASE + 'sw.js', { scope: BASE });
    await navigator.serviceWorker.ready;
    // Once the worker is active, the next ordinary load is served by it. Do not wait for it to
    // take control of THIS page: after a hard reload (Cmd+Shift+R) the browser never lets it.
    go();
  } catch (e) { fail('Could not start: ' + e.message); }
})();
</script>
